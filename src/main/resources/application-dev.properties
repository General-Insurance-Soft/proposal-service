spring.application.name=proposal-service

server.port=8033
server.servlet.context-path=/proposal-service

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.datasource.url=jdbc:mysql://localhost:3306/proposal_service?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=pass123
spring.jpa.hibernate.ddl-auto=create

spring.cloud.gateway.discovery.locator.enabled=true
eureka.instance.prefer-ip-address=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

logging.level.org.springframework.web=DEBUG
logging.level.root=ERROR
logging.level.org.hibernate= DEBUG
logging.level.app.g_agent.contact=DEBUG

#hibernate to use UTC
spring.jpa.hibernate.jdbc.time_zone=UTC


